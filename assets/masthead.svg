<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="The Malware Files — masthead for Daniel Iwugo, hacker, writer, creator">
  <defs>
    <path id="ring" d="M0,-37 A37,37 0 1,1 0,-36.99"/>
    <style>
      .serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}
      .mono{font-family:ui-monospace,'SF Mono','DejaVu Sans Mono',Consolas,monospace}
      .fd{opacity:0;animation:fd .7s ease forwards}
      @keyframes fd{to{opacity:1}}
      .seal{animation:spin 26s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="388" rx="16" fill="#0b0b0c" stroke="#2e2e30" stroke-width="1.5"/>

  <!-- ghosted wordmark watermark -->
  <text x="600" y="252" text-anchor="middle" class="serif" font-size="186" font-weight="700" letter-spacing="10" fill="#ffffff" opacity=".028">MERCURY</text>

  <!-- top rules -->
  <line x1="60" y1="44" x2="1140" y2="44" stroke="#f4f4f5" stroke-width="2"/>
  <line x1="60" y1="50" x2="1140" y2="50" stroke="#3a3a3c" stroke-width="1"/>
  <text x="60" y="76" class="mono fd" font-size="12" letter-spacing="3" fill="#8a8a8e" style="animation-delay:.15s">THE MALWARE FILES — RESEARCH &amp; WRITING</text>
  <text x="1140" y="76" text-anchor="end" class="mono fd" font-size="12" letter-spacing="3" fill="#e0102a" style="animation-delay:.15s">DISPATCHES FROM THE FIELD</text>

  <!-- rotating seal -->
  <g transform="translate(1066 206)">
    <circle r="58" fill="none" stroke="#e0102a" stroke-width="1.5"/>
    <circle r="44" fill="none" stroke="#3a3a3c" stroke-width="1"/>
    <g class="seal">
      <text class="mono" font-size="9.5" letter-spacing="3.4" fill="#9a9a9e">
        <textPath href="#ring" startOffset="0">· MALWARE RESEARCH · TOOLS · WRITING · MERCURY </textPath>
      </text>
    </g>
    <text y="13" text-anchor="middle" class="serif" font-size="38" font-weight="700" fill="#f4f4f5">M</text>
  </g>

  <!-- headline -->
  <text x="600" y="212" text-anchor="middle" class="serif fd" font-size="98" font-weight="700" letter-spacing="2" fill="#f4f4f5" style="animation-delay:.35s">DANIEL IWUGO</text>

  <!-- self-drawing red rule -->
  <line x1="478" y1="242" x2="722" y2="242" stroke="#e0102a" stroke-width="3" stroke-dasharray="244" stroke-dashoffset="244">
    <animate attributeName="stroke-dashoffset" from="244" to="0" dur="1.1s" begin=".5s" fill="freeze"/>
  </line>

  <!-- tagline -->
  <text x="600" y="294" text-anchor="middle" class="serif" font-size="29" font-style="italic" fill="#f4f4f5">
    <tspan class="fd" style="animation-delay:1.2s">Hacker.</tspan><tspan fill="#e0102a"> · </tspan><tspan class="fd" style="animation-delay:1.6s">Writer.</tspan><tspan fill="#e0102a"> · </tspan><tspan class="fd" style="animation-delay:2s">Creator.</tspan>
  </text>

  <!-- metadata -->
  <text x="600" y="338" text-anchor="middle" class="mono fd" font-size="12" letter-spacing="3" fill="#8a8a8e" style="animation-delay:2.3s">MALWARE ANALYSIS — STEGANOGRAPHY — TOOL DEVELOPMENT — RUST · PYTHON</text>

  <!-- bottom rules -->
  <line x1="60" y1="360" x2="1140" y2="360" stroke="#3a3a3c" stroke-width="1"/>
  <text x="60" y="386" class="mono" font-size="11.5" letter-spacing="2.5" fill="#8a8a8e">EDITOR · THE MALWARE FILES</text>
  <text x="1140" y="386" text-anchor="end" class="mono" font-size="11.5" letter-spacing="2.5" fill="#8a8a8e">danieliwugo.com · @ElementMerc</text>
</svg>
