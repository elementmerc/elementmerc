<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="MERCURYOS secure terminal — power-on, keyboard-only operator login, and the home screen of Daniel Iwugo">
  <defs>
    <filter id="mg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mbody"><rect x="8" y="47" width="1184" height="301"/></clipPath>
    <clipPath id="cOpid"><rect x="494" y="151" width="0" height="22"><animate attributeName="width" values="0.0;9.6;19.2;28.8;38.4;48.0;57.6;67.2;76.8;86.4;96.0;105.6" keyTimes="0.0000;0.1701;0.2450;0.3230;0.3767;0.5343;0.6356;0.7154;0.8133;0.8767;0.9467;1.0000" calcMode="discrete" begin="5s" dur="2.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="cPass"><rect x="494" y="191" width="0" height="22"><animate attributeName="width" values="0.0;9.6;19.2;28.8;38.4;48.0;57.6;67.2;76.8;86.4;96.0;105.6;115.2" keyTimes="0.0000;0.1621;0.2462;0.3340;0.3834;0.4485;0.5220;0.6007;0.6927;0.7508;0.8354;0.9154;1.0000" calcMode="discrete" begin="9s" dur="2.7s" fill="freeze"/></rect></clipPath>
    <style>text{font-family:ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,monospace}</style>
  </defs>

  <!-- screen -->
  <rect x="6" y="6" width="1188" height="348" rx="16" fill="#0b0b0c" stroke="#2e2e30" stroke-width="1.5"/>

  <!-- OS chrome strip -->
  <text x="40" y="32" font-size="14" letter-spacing="3" fill="#f4f4f5">MERCURYOS</text>
  <circle cx="1014" cy="27.5" r="3.5" fill="#e0102a"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="1160" y="32" text-anchor="end" font-size="11.5" letter-spacing="2" fill="#8a8a8e">SECURE NODE · 0xMERCURY · UTC+01:00</text>
  <line x1="20" y1="46" x2="1180" y2="46" stroke="#2e2e30" stroke-width="1.5"/>

  <g clip-path="url(#mbody)">

    <!-- ============ SCENE A — POWER ON ============ -->
    <g opacity="1">
      <animate attributeName="opacity" from="1" to="0" begin="3.2s" dur=".3s" fill="freeze"/>
      <rect x="8" y="47" width="1184" height="301" fill="#0b0b0c"/>
      <text x="600" y="158" text-anchor="middle" font-size="40" letter-spacing="11" fill="#f4f4f5" opacity="0" filter="url(#mg)"><set attributeName="opacity" to="1" begin=".4s"/>MERCURYOS</text>
      <text x="600" y="196" text-anchor="middle" font-size="12.5" letter-spacing="1.5" fill="#8a8a8e" opacity="0"><set attributeName="opacity" to="1" begin="1s"/>keyboard-only terminal — there is no pointer here, and you won't need one.</text>
      <rect x="450" y="226" width="300" height="5" rx="2.5" fill="#1b1b1e" stroke="#2e2e30" stroke-width="1" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"/></rect>
      <rect x="450" y="226" width="0" height="5" rx="2.5" fill="#e0102a" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"/><animate attributeName="width" from="0" to="300" begin="1.6s" dur="1.3s" fill="freeze"/></rect>
      <text x="600" y="254" text-anchor="middle" font-size="11" letter-spacing="2" fill="#6f6f73" opacity="0"><set attributeName="opacity" to="1" begin="3s"/>secure environment ready</text>
    </g>

    <!-- ============ SCENE B — OPERATOR LOGIN ============ -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="3.4s"/>
      <set attributeName="opacity" to="0" begin="14.95s"/>
      <rect x="8" y="47" width="1184" height="301" fill="#0b0b0c"/>
      <text x="600" y="96" text-anchor="middle" font-size="13" letter-spacing="3" fill="#8a8a8e" opacity="0"><set attributeName="opacity" to="1" begin="3.8s"/>MERCURYOS // SECURE TERMINAL</text>
      <line x1="360" y1="116" x2="840" y2="116" stroke="#2e2e30" stroke-width="1.5" stroke-dasharray="480" stroke-dashoffset="480" opacity="0"><set attributeName="opacity" to="1" begin="4s"/><animate attributeName="stroke-dashoffset" from="480" to="0" begin="4s" dur=".6s" fill="freeze"/></line>

      <text x="360" y="165" font-size="16" fill="#8a8a8e" opacity="0"><set attributeName="opacity" to="1" begin="4.5s"/>operator id:</text>
      <text x="494" y="165" font-size="16" fill="#f4f4f5" clip-path="url(#cOpid)">elementmerc</text>
      <rect y="150" width="10" height="19" fill="#e0102a" opacity="0"><set attributeName="opacity" to="1" begin="4.95s"/><animate attributeName="x" values="494.0;503.6;513.2;522.8;532.4;542.0;551.6;561.2;570.8;580.4;590.0;599.6" keyTimes="0.0000;0.1701;0.2450;0.3230;0.3767;0.5343;0.6356;0.7154;0.8133;0.8767;0.9467;1.0000" calcMode="discrete" begin="5s" dur="2.8s" fill="freeze"/><set attributeName="opacity" to="0" begin="7.85s"/></rect>

      <text x="360" y="205" font-size="16" fill="#8a8a8e" opacity="0"><set attributeName="opacity" to="1" begin="8.4s"/>passphrase:</text>
      <text x="494" y="205" font-size="16" fill="#8a8a8e" clip-path="url(#cPass)">************</text>
      <rect y="190" width="10" height="19" fill="#e0102a" opacity="0"><set attributeName="opacity" to="1" begin="8.95s"/><animate attributeName="x" values="494.0;503.6;513.2;522.8;532.4;542.0;551.6;561.2;570.8;580.4;590.0;599.6;609.2" keyTimes="0.0000;0.1621;0.2462;0.3340;0.3834;0.4485;0.5220;0.6007;0.6927;0.7508;0.8354;0.9154;1.0000" calcMode="discrete" begin="9s" dur="2.7s" fill="freeze"/><set attributeName="opacity" to="0" begin="11.75s"/></rect>

      <text x="360" y="262" font-size="15" fill="#6f6f73" opacity="0"><set attributeName="opacity" to="1" begin="12.3s"/><tspan fill="#e0102a">&gt; </tspan>authenticating credentials</text>
      <text x="612" y="262" font-size="15" fill="#6f6f73" opacity="0"><set attributeName="opacity" to="1" begin="12.6s"/>.</text>
      <text x="621" y="262" font-size="15" fill="#6f6f73" opacity="0"><set attributeName="opacity" to="1" begin="13s"/>.</text>
      <text x="630" y="262" font-size="15" fill="#6f6f73" opacity="0"><set attributeName="opacity" to="1" begin="13.4s"/>.</text>
      <text x="360" y="298" font-size="15" opacity="0"><set attributeName="opacity" to="1" begin="14.2s"/><tspan fill="#e0102a">&gt; ACCESS GRANTED</tspan><tspan fill="#c4c4c6"> — welcome back, operator.</tspan></text>
    </g>

    <!-- ============ SCENE C — HOME SCREEN ============ -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="15s"/>
      <rect x="8" y="47" width="1184" height="301" fill="#0b0b0c"/>
      <text x="360" y="108" font-size="15" letter-spacing="2" fill="#f4f4f5" opacity="0"><set attributeName="opacity" to="1" begin="15.3s"/>HOME</text>
      <text x="840" y="108" text-anchor="end" font-size="15" fill="#8a8a8e" opacity="0"><set attributeName="opacity" to="1" begin="15.3s"/>operator // <tspan fill="#f4f4f5">Daniel Iwugo</tspan></text>
      <line x1="360" y1="124" x2="840" y2="124" stroke="#e0102a" stroke-width="2" stroke-dasharray="480" stroke-dashoffset="480" opacity="0"><set attributeName="opacity" to="1" begin="15.6s"/><animate attributeName="stroke-dashoffset" from="480" to="0" begin="15.6s" dur=".7s" fill="freeze"/></line>

      <rect x="360" y="146" width="2.5" height="132" fill="#e0102a" opacity="0"><set attributeName="opacity" to="1" begin="16s"/></rect>
      <text x="380" y="166" font-size="15" opacity="0"><set attributeName="opacity" to="1" begin="16s"/><tspan fill="#8a8a8e">IDENTITY      </tspan><tspan fill="#f4f4f5">hacker · writer · creator</tspan></text>
      <text x="380" y="196" font-size="15" opacity="0"><set attributeName="opacity" to="1" begin="16.4s"/><tspan fill="#8a8a8e">DISCIPLINE    </tspan><tspan fill="#f4f4f5">malware research · reverse engineering</tspan></text>
      <text x="380" y="226" font-size="15" opacity="0"><set attributeName="opacity" to="1" begin="16.8s"/><tspan fill="#8a8a8e">TOOLCHAIN     </tspan><tspan fill="#f4f4f5">rust · python · yara · steganography</tspan></text>
      <text x="380" y="256" font-size="15" opacity="0"><set attributeName="opacity" to="1" begin="17.2s"/><tspan fill="#8a8a8e">ACTIVE WORK   </tspan><tspan fill="#e0102a">anya</tspan><tspan fill="#f4f4f5"> · </tspan><tspan fill="#e0102a">stegcore</tspan><tspan fill="#f4f4f5"> · </tspan><tspan fill="#e0102a">dct-io</tspan></text>

      <line x1="360" y1="288" x2="840" y2="288" stroke="#2e2e30" stroke-width="1.5" opacity="0"><set attributeName="opacity" to="1" begin="17.7s"/></line>
      <text x="360" y="312" font-size="12" letter-spacing="1.5" fill="#6f6f73" opacity="0"><set attributeName="opacity" to="1" begin="18s"/>session secure · keyboard-only · editor @ The Malware Files</text>
      <rect x="846" y="300" width="9" height="16" fill="#e0102a" opacity="0"><animate attributeName="opacity" values="1;1;0;0" dur="1.06s" begin="18.4s" repeatCount="indefinite" calcMode="discrete"/></rect>
    </g>

  </g>
</svg>
