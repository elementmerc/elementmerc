<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Mercury OS — operator profile for Daniel Iwugo, threat research console">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#080809"/>
    </linearGradient>
    <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0102a" stop-opacity="0"/>
      <stop offset="1" stop-color="#e0102a" stop-opacity=".34"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".74">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".62"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1b1b1e" stroke-width="1"/>
    </pattern>
    <filter id="rg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,monospace;}
      .tw{animation:tw 3.4s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.08}50%{opacity:.8}}
      .rev{opacity:0;animation:rev .5s ease forwards}
      @keyframes rev{to{opacity:1}}
      .bk{animation:bk 1.05s steps(1) infinite}
      @keyframes bk{50%{opacity:0}}
      .blip{opacity:0;animation:blip 4.8s ease-in-out infinite}
      @keyframes blip{0%,70%,100%{opacity:0}77%{opacity:1}90%{opacity:.5}}
      .pls{animation:pls 1.9s ease-in-out infinite}
      @keyframes pls{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="348" rx="18" fill="url(#bg)" stroke="#2e2e30" stroke-width="1.5"/>
  <rect x="6" y="6" width="1188" height="348" rx="18" fill="url(#grid)"/>

  <!-- ambient noise -->
  <g fill="#f4f4f5">
    <circle class="tw" cx="470" cy="44" r="1.3" style="animation-delay:.1s"/>
    <circle class="tw" cx="690" cy="70" r="1" style="animation-delay:1.2s"/>
    <circle class="tw" cx="900" cy="40" r="1.4" style="animation-delay:.7s"/>
    <circle class="tw" cx="560" cy="300" r="1.1" style="animation-delay:2s"/>
    <circle class="tw" cx="820" cy="318" r="1.2" style="animation-delay:1.6s"/>
    <circle class="tw" cx="1120" cy="250" r="1.2" style="animation-delay:.4s"/>
    <circle class="tw" cx="380" cy="260" r="1" style="animation-delay:2.6s"/>
    <circle class="tw" cx="980" cy="300" r="1.1" style="animation-delay:3.1s"/>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#e0102a" stroke-width="2" fill="none">
    <path d="M16 44V16H44"/>
    <path d="M1156 16H1184V44"/>
    <path d="M16 316V344H44"/>
    <path d="M1156 344H1184V316"/>
  </g>

  <!-- top status strip -->
  <text x="60" y="42" font-size="12" letter-spacing="3" fill="#8a8a8e">MERCURY//OS  ·  v8.0  ·  KERNEL: secure</text>
  <circle cx="1090" cy="38" r="4" fill="#e0102a" class="pls"/>
  <text x="1108" y="42" font-size="12" letter-spacing="3" fill="#c4c4c6">LIVE</text>

  <!-- RADAR -->
  <g transform="translate(206 190)">
    <circle r="140" fill="#0e0e10" stroke="#34343a" stroke-width="1.5"/>
    <circle r="106" fill="none" stroke="#2a2a2e" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#2a2a2e" stroke-width="1"/>
    <circle r="34" fill="none" stroke="#2a2a2e" stroke-width="1"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#2a2a2e" stroke-width="1"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#2a2a2e" stroke-width="1"/>
    <g>
      <path d="M0 0L140 0A140 140 0 0 0 90 -107.2Z" fill="url(#wedge)"/>
      <line x1="0" y1="0" x2="140" y2="0" stroke="#ff3a3a" stroke-width="2.5" filter="url(#rg)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.8s" repeatCount="indefinite"/>
    </g>
    <circle class="blip" cx="58" cy="-46" r="4.5" fill="#ff3a3a" style="animation-delay:0s"/>
    <circle class="blip" cx="-80" cy="40" r="4" fill="#f4f4f5" style="animation-delay:1.6s"/>
    <circle class="blip" cx="36" cy="92" r="4.5" fill="#ff3a3a" style="animation-delay:3s"/>
    <circle r="5.5" fill="#e0102a" filter="url(#rg)"/>
  </g>
  <text x="206" y="350" text-anchor="middle" font-size="11.5" letter-spacing="3" fill="#8a8a8e">RADAR · LIVE THREAT FEED</text>

  <!-- TITLE -->
  <text x="416" y="118" font-size="62" font-weight="700" fill="#f4f4f5" filter="url(#rg)">MERCURY<tspan fill="#e0102a">//</tspan>OS</text>
  <text x="420" y="150" font-size="14.5" letter-spacing="2.5" fill="#c4c4c6">OPERATOR: ELEMENTMERC  ·  DANIEL IWUGO</text>
  <text x="420" y="174" font-size="12.5" letter-spacing="1.5" fill="#8a8a8e">// hacker · writer · creator — securing systems by thinking like the threat</text>

  <!-- READOUT PANEL -->
  <rect x="420" y="196" width="446" height="100" rx="8" fill="#141416" stroke="#2e2e30" stroke-width="1.5"/>
  <text x="438" y="220" font-size="11" letter-spacing="3" fill="#8a8a8e">THREAT RESEARCH — CAPABILITIES</text>
  <g font-size="14" fill="#f4f4f5">
    <text class="rev" x="438" y="246" style="animation-delay:.3s"><tspan fill="#e0102a">▸ </tspan>malware analysis · reverse engineering</text>
    <text class="rev" x="438" y="268" style="animation-delay:.7s"><tspan fill="#e0102a">▸ </tspan>steganography · OPSEC · YARA · threat intel</text>
    <text class="rev" x="438" y="290" style="animation-delay:1.1s"><tspan fill="#e0102a">▸ </tspan>building in  rust  +  python<tspan class="bk" fill="#e0102a"> █</tspan></text>
  </g>

  <!-- MESSENGER EMBLEM -->
  <g transform="translate(990 70)">
    <rect width="146" height="146" rx="10" fill="#141416" stroke="#e0102a" stroke-width="1.6"/>
    <text x="16" y="30" font-size="10" letter-spacing="2" fill="#e0102a">TX</text>
    <text x="130" y="30" text-anchor="end" font-size="10" letter-spacing="1.5" fill="#8a8a8e">ONLINE</text>
    <g fill="none" stroke-linecap="round">
      <path d="M73,58 Q56,46 36,49" stroke="#e0102a" stroke-width="2.6"/>
      <path d="M73,63 Q58,55 41,60" stroke="#cf3340" stroke-width="2.2"/>
      <path d="M73,68 Q61,63 47,70" stroke="#8a8a8e" stroke-width="2"/>
      <path d="M73,58 Q90,46 110,49" stroke="#e0102a" stroke-width="2.6"/>
      <path d="M73,63 Q88,55 105,60" stroke="#cf3340" stroke-width="2.2"/>
      <path d="M73,68 Q85,63 99,70" stroke="#8a8a8e" stroke-width="2"/>
      <line x1="73" y1="61" x2="73" y2="98" stroke="#5a5a5e" stroke-width="2"/>
    </g>
    <circle cx="73" cy="98" r="3" fill="#5a5a5e"/>
    <circle cx="73" cy="55" r="6.5" fill="#e0102a" class="pls"/>
    <text x="73" y="122" text-anchor="middle" font-size="11.5" letter-spacing="3" fill="#f4f4f5">MESSENGER</text>
    <text x="73" y="136" text-anchor="middle" font-size="9" letter-spacing="2" fill="#8a8a8e">SIGNAL · RELAYED</text>
  </g>
  <text x="1063" y="238" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#8a8a8e">// mercury — messenger of the field</text>

  <!-- SYSTEMS BAR -->
  <text x="420" y="322" font-size="11" letter-spacing="3" fill="#8a8a8e">SYSTEMS ONLINE</text>
  <rect x="420" y="330" width="540" height="9" rx="4.5" fill="#1b1b1e" stroke="#2e2e30" stroke-width="1"/>
  <rect x="420" y="330" width="0" height="9" rx="4.5" fill="#e0102a">
    <animate attributeName="width" from="0" to="540" dur="2.6s" fill="freeze"/>
  </rect>
  <text x="978" y="338" font-size="11" letter-spacing="2" fill="#c4c4c6">100%</text>

  <rect x="6" y="6" width="1188" height="348" rx="18" fill="url(#vig)" pointer-events="none"/>
</svg>
